<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册页面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>用户注册</h1>
    </header>
    <main>
        <table>
            <thead>
                <tr>
                    <th colspan="2">注册须知</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>条款1</td>
                    <td>注册账号必须填写真实信息</td>
                </tr>
                <tr>
                    <td>条款2</td>
                    <td>密码长度为6-16位字符</td>
                </tr>
                <tr>
                    <td rowspan="2">条款3</td>
                    <td>一个手机号仅可注册一个账号</td>
                </tr>
                <tr>
                    <td>禁止使用账号从事违规活动</td>
                </tr>
            </tbody>
        </table>

        <h3>注册准备事项</h3>
        <ul>
            <li>准备手机号</li>
            <li>设置登录密码</li>
            <li>准备邮箱</li>
        </ul>
        <h3>注册步骤</h3>
        <ol>
            <li>填写表单信息</li>
            <li>核对信息</li>
            <li>提交注册</li>
        </ol>
        <h3>常见术语</h3>
        <dl>
            <dt>用户名</dt>
            <dd>登录系统使用的账号名称</dd>
            <dt>邮箱</dt>
            <dd>用于找回密码的通信地址</dd>
        </dl>

        <form id="registerForm">
            <p>
                <label for="username">用户名：</label>
                <input type="text" name="username" id="username" required>
            </p>
            <p>
                <label for="password">密码：</label>
                <input type="password" name="password" id="password" placeholder="6-16位字符">
            </p>
            <p>
                <label for="confirmPassword">确认密码：</label>
                <input type="password" name="confirmPassword" id="confirmPassword">
            </p>
            <p>
                <label>性别：</label>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">男</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">女</label>
            </p>
            <p>
                <label for="birthday">出生日期：</label>
                <input type="date" name="birthday" id="birthday">
            </p>
            <p>
                <label for="email">邮箱：</label>
                <input type="email" name="email" id="email" required>
            </p>
            <p>
                <label for="phone">手机号：</label>
                <input type="tel" name="phone" id="phone">
            </p>
            <p>
                <label>兴趣爱好：</label>
                <input type="checkbox" name="hobby" id="read" value="reading">
                <label for="read">阅读</label>
                <input type="checkbox" name="hobby" id="sport" value="sports">
                <label for="sport">运动</label>
                <input type="checkbox" name="hobby" id="music" value="music">
                <label for="music">音乐</label>
            </p>
            <p>
                <label for="avatar">上传头像：</label>
                <input type="file" name="avatar" id="avatar" accept="image/*" multiple>
            </p>
            <p>
                <label for="city">所在城市：</label>
                <select name="city" id="city">
                    <option value="changde" selected>常德</option>
                    <option value="changsha">长沙</option>
                    <option value="zhuzhou">株洲</option>
                </select>
            </p>
            <p>
                <label for="bio">个人简介：</label>
                <textarea name="bio" id="bio" rows="4" cols="50"></textarea>
            </p>
            <p>
                <button type="submit">注册</button>
                <button type="reset">重置</button>
            </p>
        </form>
    </main>
    <footer>
        <p>版权所有 © 用户注册系统</p>
    </footer>

    <script>
        const form = document.getElementById("registerForm");
        form.addEventListener("submit", function(e){
            e.preventDefault();
            const formData = new FormData(form);
            console.log("表单提交成功：");
            for(let item of formData){
                console.log(item);
            }
            alert('提交成功！打开F12控制台查看数据');
        })
    </script>
</body>
</html>
