<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二级水平导航菜单</title>
    <style>
li {
  list-style: none;
  display: inline-block;
  position: relative;
  padding:12px 18px;
  background:#2c5aa0;
}
li a {
  color:white;
  text-decoration:none;
}
li:hover {
  background:#1d3f70;
}
li > ul {
  display: none;
  position: absolute;
  top:100%;
  left:0;
  background:#333;
  z-index:999;
  padding:0;
}
li:hover > ul {
  display:block;
}
li > ul > li {
  display:block;
  white-space: nowrap;
}
</style>

</head>
<body>
    <ul>
        <li class="logo">欢迎访问湖南文理学院</li>
    </ul>

            </ul>
        </li>
        <li><a href="#">党群机构</a></li>        
        <li><a href="#">行政教辅机构</a></li>

</body>
</html>
